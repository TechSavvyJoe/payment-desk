<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Payment Desk Companion</title>
    <link rel="stylesheet" href="popup.css">
    <script type="module" src="popup.js"></script>
  </head>
  <body>
    <header><img src="icons/icon-48.png" width="36" height="36" alt=""><div><h1>Payment Desk</h1><p>Vehicle listing companion</p></div><button id="open-desk" class="quiet" type="button">Open desk ↗</button></header>
    <main>
      <button id="capture" class="capture" type="button">Capture vehicle from this page</button>
      <p id="source" class="source">Open a vehicle listing, then capture its details.</p>
      <form id="vehicle-form" novalidate>
        <label for="vehicle-name">Vehicle <span>Optional</span></label>
        <input id="vehicle-name" type="text" maxlength="67" placeholder="e.g. 2024 Ford Explorer" autocomplete="off">
        <div class="fields">
          <div><label for="stock">Stock # <span>Optional</span></label><input id="stock" type="text" maxlength="24" placeholder="H12345" autocomplete="off"></div>
          <div><label for="price">Selling price <span>USD</span></label><input id="price" type="text" inputmode="decimal" placeholder="$29,995" autocomplete="off" aria-describedby="notice"></div>
        </div>
        <p id="notice" role="status" aria-live="polite">Review or enter the vehicle details. Payment Desk will confirm them before starting a new estimate.</p>
        <button id="start-estimate" class="primary" type="submit">Start estimate ↗</button>
      </form>
      <p class="privacy">Reads this page only when you select Capture. Nothing is saved by the extension.</p>
    </main>
  </body>
</html>
